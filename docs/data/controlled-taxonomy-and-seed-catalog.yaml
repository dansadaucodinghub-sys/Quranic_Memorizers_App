external_authoritative_imports:
  nigeria_geography:
    open_decision: 'OD-061'
    required_source: 'Qualified authoritative Nigerian geography source selected by Geography Governance'
    required_metadata: ['source identifier', 'source version', 'acquired_at', 'checksum', 'importer version', 'mapping report', 'review decisions', 'activation record']
    validation: 'Hierarchy, code/name uniqueness, validity ranges, replacement cycles, row counts and checksum are reviewed before activation'
    fabricated_codes_prohibited: true
  quran_release:
    open_decision: 'OD-063'
    required_source: 'Qualified authoritative Quran text/release source and Reading selected by Quran Reference Governance'
    required_metadata: ['release identifier', 'Reading', 'source license/authority', 'source version', 'checksum', 'technical comparison', 'dual qualified review', 'activation record']
    validation: 'Structural counts are source-derived, exact text checksums match, mappings are complete and review approvals are recorded'
    handwritten_values_prohibited: true
bootstrap_order:
  - sequence: 1
    action: 'Platform context and schema metadata'
  - sequence: 2
    action: 'System permission codes'
  - sequence: 3
    action: 'Baseline role templates'
  - sequence: 4
    action: 'Nigeria administrative hierarchy after OD-061'
  - sequence: 5
    action: 'Organization types'
  - sequence: 6
    action: 'Record provenance classifications'
  - sequence: 7
    action: 'Initial administrator invitation with no shared password'
  - sequence: 8
    action: 'Audit-chain genesis and external-checkpoint configuration'
  - sequence: 9
    action: 'Key references only; no secrets in MySQL'
  - sequence: 10
    action: 'First approved Quran release after OD-063'
  - sequence: 11
    action: 'Feature flags and configuration versions'

