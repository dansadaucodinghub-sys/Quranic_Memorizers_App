expected_p2_freeze_manifest: docs/closeout/p2/qmdb-p2-identity-security-tenancy-freeze.yaml
allowed_modules:
  - reference.geography
  - people.profiles
  - organizations.registry
  - organizations.affiliations
  - people.identity_resolution
allowed_scope:
  - Nigerian country and administrative-reference data
  - geography migrations and seed registration
  - public read-only routes and route-security classification
  - readiness, verification CLI, views, fragments, and progressive enhancement
  - global Person, private Account self-link, bounded role-profile and Memorizer-progress foundations
  - self-declared profile-management guardianship only, with minor and step-up protections
  - controlled P2 security-catalog, CSRF, idempotency, audit, notification, and rate-limit extensions
  - consent-aware, tenant-scoped Organization-to-Person affiliation source, private account inventories,
    lifecycle records, assignment sets, organization retirement guards, and maintenance
  - private Account-to-Person claim pairing, Guardian or QMDB record-review authorization, private
    record-status assertions, consent-gated duplicate cases, canonical aliases, and bounded maintenance
  - bounded read-only P3 security composition, Person repository scope verification, adversarial-test evidence,
    privacy/control reconciliation and closeout-readiness reporting without P3-CLOSE execution
prohibited_modules:
  - Competitions
  - Person search, discovery, deletion, contacts, dependent Accounts and tenant-owned Person data
  - guardian invitation/transfer, legal-status certification and relationship verification workflows
assurance:
  - QMDB-P2-FRZ-001 remains unmodified as the historical P2 baseline.
  - P2 controlled-extension entries remain inventoried without rewriting QMDB-P2-FRZ-001.
  - New P3 geography and people-profile source are excluded only from the P2 inventory by explicit policy prefix lists.
  - The P3 composition bridge may update only the existing application JavaScript entry point, ApplicationFactory,
    ApplicationMetadata, ApplicationHttpModule, ConsoleFoundationModule, PresentationFoundationModule,
    ApplicationReadinessController, and ProductionRouteSecurityPolicyCatalog; each is verified as a named
    authorization exception rather than silently rewriting the P2 manifest.
  - The P3 release composition bridge may update only tools/Build/ReleaseFilePolicy.php and its
    tests/Tools/Build/ReleaseFilePolicyTest.php regression test so the canonical geography dataset is present in
    the generated artifact.
  - The P3-B02 compatibility bridge may update only the P2 closed catalogs and service contracts explicitly
    enumerated by P2FreezePolicy::P3_B02_MUTABLE_EXISTING_PATHS; changes are recorded as controlled extensions,
    not a rewrite of QMDB-P2-FRZ-001.
  - The P3-B03 compatibility bridge may update only the P2 closed catalogs, schema planning and seed-planning
    contracts explicitly enumerated by P2FreezePolicy::P3_B03_MUTABLE_EXISTING_PATHS; changes are controlled
    extensions and do not rewrite QMDB-P2-FRZ-001.
  - The P3-B04 affiliation module and its dedicated bootstrap module are explicit controlled extensions. Existing
    P2 compatibility contracts remain governed by the already enumerated B01, B02, and B03 bridge lists; this
    entry never alters the historical QMDB-P2-FRZ-001 manifest or its frozen checksums.
  - The P3-B04 compatibility bridge may correct the schema-seed retry ledger so a failed seed that is corrected
    before retry records the checksum of the source actually applied. It is a named P2 immutable-source exception
    in P2FreezePolicy and does not revise any applied migration or seed data.
  - The P3-B05 compatibility bridge may add private identity-resolution source, schema, routes, tests and
    progressive enhancement. It may extend only the named closed P2 security catalogs and composition bridges
    in P2FreezePolicy::P3_B05_MUTABLE_EXISTING_PATHS; it does not revise QMDB-P2-FRZ-001.
  - The P3-B05 compatibility bridge may normalize phpunit.xml.dist by removing overlapping named suites while
    retaining the Quality and MySQL suites. This repairs duplicate test registration warnings without changing
    production behavior, test discovery coverage, or QMDB-P2-FRZ-001.
  - The P3-B05 compatibility bridge may add English and Arabic private identity-resolution interface copy to the
    established translation catalogs and may use the existing accessible confirmation dialog for destructive B05
    actions. It may pass the already-rendered page locale on existing progressive mutation requests. It does not
    change P2 authentication, authorization, session, or tenant semantics.
  - The P3-B05 compatibility bridge may update named MySQL test-isolation fixtures to remove new
    identity-resolution dependent tables before their frozen P2 parent tables, and may refresh a P2 test's
    registered-seed cardinality or mark the B05 maintenance slot complete inside a deliberately P2-only
    scheduler fixture. These are test-only dependency-order corrections required by the B05 schema.
  - The P3-B05 compatibility bridge may record the bounded claim, duplicate-resolution, privacy and operational
    parameter decisions in the existing quality-attribute, decision, open-decision and risk registers. Those
    records document the new controlled extension without changing the historical QMDB-P2-FRZ-001 evidence.
  - The P3-B05 P0 documentation extension ledger binds the two explicitly authorized parameter/architecture
    records to their preceding P3-B02 extension hashes and preserves QMDB-P0-FRZ-001 unchanged.
  - The P3-B06 compatibility bridge may add only bounded verifier source, focused security architecture tests and
    named evidence records. It may update only P2FreezePolicy::P3_B06_MUTABLE_EXISTING_PATHS and does not alter
    QMDB-P2-FRZ-001 or execute P3-CLOSE.
