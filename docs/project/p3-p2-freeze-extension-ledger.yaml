allowed_modules:
  - reference.geography
  - people.profiles
  - organizations.registry
  - organizations.affiliations
allowed_scope:
  - Nigerian country and administrative-reference data
  - geography migrations and seed registration
  - public read-only routes and route-security classification
  - readiness, verification CLI, views, fragments, and progressive enhancement
  - global Person, private Account self-link, bounded role-profile and Memorizer-progress foundations
  - self-declared profile-management guardianship only, with minor and step-up protections
  - controlled P2 security-catalog, CSRF, idempotency, audit, notification, and rate-limit extensions
  - consent-aware, tenant-scoped Organization-to-Person affiliation source, private account inventories,
    lifecycle records, assignment sets, organization retirement guards, and maintenance
prohibited_modules:
  - Competitions
  - Person search, discovery, merge, deletion, profile claiming, contacts, dependent Accounts and tenant-owned Person data
  - guardian consent, legal-status certification and relationship verification workflows
assurance:
  - QMDB-P2-FRZ-001 remains unmodified as the historical P2 baseline.
  - P2 controlled-extension entries remain inventoried without rewriting QMDB-P2-FRZ-001.
  - New P3 geography and people-profile source are excluded only from the P2 inventory by explicit policy prefix lists.
  - The P3 composition bridge may update only the existing application JavaScript entry point, ApplicationFactory,
    ApplicationMetadata, ApplicationHttpModule, ConsoleFoundationModule, PresentationFoundationModule,
    ApplicationReadinessController, and ProductionRouteSecurityPolicyCatalog; each is verified as a named
    authorization exception rather than silently rewriting the P2 manifest.
  - The P3 release composition bridge may update only tools/Build/ReleaseFilePolicy.php and its
    tests/Tools/Build/ReleaseFilePolicyTest.php regression test so the canonical geography dataset is present in
    the generated artifact.
  - The P3-B02 compatibility bridge may update only the P2 closed catalogs and service contracts explicitly
    enumerated by P2FreezePolicy::P3_B02_MUTABLE_EXISTING_PATHS; changes are recorded as controlled extensions,
    not a rewrite of QMDB-P2-FRZ-001.
  - The P3-B03 compatibility bridge may update only the P2 closed catalogs, schema planning and seed-planning
    contracts explicitly enumerated by P2FreezePolicy::P3_B03_MUTABLE_EXISTING_PATHS; changes are controlled
    extensions and do not rewrite QMDB-P2-FRZ-001.
  - The P3-B04 affiliation module and its dedicated bootstrap module are explicit controlled extensions. Existing
    P2 compatibility contracts remain governed by the already enumerated B01, B02, and B03 bridge lists; this
    entry never alters the historical QMDB-P2-FRZ-001 manifest or its frozen checksums.
